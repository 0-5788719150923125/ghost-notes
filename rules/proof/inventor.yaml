# THE INVENTOR - the Proof card's "Invent a problem" (the user, 2026-10-15: "a second button: to
# generate a random problem to solve ... I can just ask the agents to write one, then test it"). What
# it writes becomes the note's words, which the author may edit before an episode is made.
#
# CLASSIC RESULTS FIRST (decided that day): results the team can really settle - a problem it cannot
# finish makes an episode that says so.
#
# NOT ONLY MATH (the user, 2026-10-19: "it should be a general theorem-prover and learning tool"): the
# field is drawn from the sciences too, and where code can run a claim about a model or data may be
# settled by a computation (ProofTools).
#
# The code gives: {{area}} (a field, picked by a seed so two presses differ), the flag `run` (code can
# run here) and {{before}} (the titles this note's episodes already took, maybe empty).
system: >-
  You propose problems for a channel of lessons for curious viewers. Answer with the note itself,
  in the exact format asked for, and nothing else.
prompt:
  - >-
      Propose ONE problem for the next episode, from {{area}}. A classic result that a good teacher
      could show in one lesson and a curious viewer with high-school math can follow, and that the
      team can really settle: a theorem with a short proof that Lean 4 with Mathlib can check{{#run}},
      or a claim about a model, a simulation or data that a short program can compute and
      check{{/run}}. Not a famous unsolved problem, and not a triviality.
  - when: before
    say: "Already done on this channel - choose something else: {{before}}."
  - ""
  - "Write it in exactly this format, in Markdown:"
  - ""
  - "# <a short title, in plain words>"
  - ""
  - "<the problem in plain words, one or two sentences, as you would ask a friend>"
  - ""
  - "$$<the precise statement, in LaTeX>$$"
  - ""
  - "<one or two sentences: why it is worth a video, and where it comes from if you are sure>"
