# THE INVENTOR - the Proof card's "Invent a problem" (the user, 2026-10-15: "a second button: to
# generate a random problem to solve ... I can just ask the agents to write one, then test it"). What
# it writes becomes the note's words, which the author may edit before an episode is made.
#
# CLASSIC THEOREMS FIRST (decided that day): results with an elementary proof the team can really
# finish and check in Lean with Mathlib - a problem it cannot finish makes an episode that says so.
#
# The code gives: {{area}} (a branch of math, picked by a seed so two presses differ) and {{before}}
# (the titles this note's episodes already took, maybe empty).
system: >-
  You propose problems for a channel of math lessons for curious viewers. Answer with the note
  itself, in the exact format asked for, and nothing else.
prompt:
  - >-
      Propose ONE problem for the next episode, from {{area}}. A classic result - a theorem with
      a short, elementary proof a good teacher could show in ten minutes - that a curious viewer
      with high-school math can follow, and that can be proved in Lean 4 with Mathlib in under
      forty lines. Not a famous unsolved problem, and not a triviality.
  - when: before
    say: "Already done on this channel - choose something else: {{before}}."
  - ""
  - "Write it in exactly this format, in Markdown:"
  - ""
  - "# <a short title, in plain words>"
  - ""
  - "<the problem in plain words, one or two sentences, as you would ask a friend>"
  - ""
  - "$$<the precise statement, in LaTeX>$$"
  - ""
  - "<one or two sentences: why it is worth a video, and where it comes from if you are sure>"
