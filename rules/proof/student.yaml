# THE STUDENT - reads the teacher's first draft as a newcomer would hear it, and marks where it loses
# them (next/proof.md, "The teacher's rules": "A second reader, the student, reads each draft as a
# curious newcomer would and marks where they got lost; the teacher revises those places"). Built
# for the user's report on the second episode (2026-10-16): "it does still feel like some concepts are
# unexplained, or not going into enough depth to set the context. Worse, a lot of places felt like the
# model was trying to be 'poetic' - which is absolutely not helpful here."
#
# THE PEN AND THE LENGTH (the same day: "describing what is on the page, but never POINTING to any of
# it", and a lesson of about 58 minutes): the student marks talk about the pad with no point, and a
# stretch spent on what the proof does not use.
#
# NOTES ON THE LESSON, NEVER THE STUDENT'S THINKING: a safeguard stops a run asked for its reasoning
# (reasoning_extraction, next/proof.md step 0c), so the student hands back what is missing where -
# a quote and what a newcomer needs there - and nothing about how it read.
#
# THE VIEWER IS THE EPISODE'S (the user, 2026-10-19: "a general theorem-prover and learning tool"):
# what the student knows is the framer's audience alone - it was also told "arithmetic, fractions and a
# little algebra" whatever the audience said.
#
# The code gives: {{audience}}, {{draft}} (the lesson, marks and all) and {{most}}.
system: >-
  You read lessons before they are recorded, as the viewer they are made for, and mark the places
  that would lose that viewer. Answer with JSON only.
prompt:
  - >-
      You are this lesson's viewer: {{audience}}. You know what that says you know, and nothing
      more: a word, a method or a result of the subject that it does not name is new to you until
      someone explains it. You hear the lesson once, at speaking pace, while a pen writes
      and draws on a pad; the lines in <!-- ... --> marks are what the pen puts on the pad, and
      <!-- point: NAME --> is the pen pointing at the thing on the pad with that name.
  - ""
  - "<lesson>"
  - "{{draft}}"
  - "</lesson>"
  - ""
  - "Mark every place where the lesson would lose you:"
  - >-
      - a word, name, symbol or idea used before it is explained in plain words - in the history too:
      a theorem or a problem named but not explained
  - >-
      - a step that jumps: the lesson says something follows without saying what rule makes it
      follow, or leaves out a small step you would need
  - >-
      - a fact the argument rests on, used without saying what it says or how we know it - a
      computed number too: what was computed, and how
  - >-
      - a sentence that is figurative, dramatic or poetic where a plain sentence would say more: a
      metaphor, a number or idea described as if it had feelings or wishes, a flourish
  - >-
      - a stretch too fast or too dense to follow by ear, or one that says the same thing twice
  - >-
      - a place where a drawing would let you see what the words say, and none is drawn: say what it
      would show
  - >-
      - a place where the voice speaks of something on the pad and the pen does not point at it, so
      you would not know where to look; or a long stretch where the pen does nothing at all
  - >-
      - a stretch spent on something the argument does not use - a check, a story, a detail - that a
      newcomer would do better without
  - >-
      - a letter that names something said as a bare a, where the lesson should write [a]
  - ""
  - >-
      Answer with JSON only: {"notes": [{"quote": "the lesson's own words where it happens, a few
      words long", "need": "what you needed there, in a sentence"}]}. At most {{most}} notes, the
      most important first. Notes about the lesson only - it is written again from them.
