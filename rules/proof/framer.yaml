# THE FRAMER - the episode's first step: it fixes the problem before anyone works on it, so the
# statement the solver proves and the one the teacher teaches are one statement, set down first.
# ProofPrompts.framer fills it in; ProofProducer._land_problem checks the shape of the answer.
#
# FORBIDDEN FACTS: Mathlib often holds the very theorem being proved (Nat.exists_infinite_primes,
# irrational_sqrt_two). A proof that cites it proves nothing a viewer can learn from, so the framer
# names them and the checker refuses a proof that uses one (hosts/math/lean_check.py).
#
# A PROPER EPISODE NAME (the user, 2026-10-15: "it's unclear what the title or episode name would even
# be here ... structure the agents' logic to create a proper episode name"): the framer names the
# episode the way Cards' producer does - the same rule, included (rules/agents/episode.yaml) - for
# the line it goes up in, beside a YouTube description and tags. The description says nothing of
# whether the proof was checked: the upload adds that line from what Lean said (ProofCard.upload_base).
#
# The code gives: {{uploads_as}} (the line the title goes up in, maybe empty) and {{before}} (the
# titles this note's other episodes took, maybe empty).
prompt:
  - >-
      You are the FRAMER of this episode. Read the note and fix the problem the episode is about,
      before anyone works on it.
  - ""
  - "Answer with ONE JSON object and nothing else:"
  - ""
  - "{"
  - '  "episode_title": "this episode''s title, in title case{{#uploads_as}} - its own part of the line the video goes up as{{/uploads_as}}",'
  - '  "statement": "the problem in plain words, as the teacher will first say it aloud",'
  - '  "latex": "the precise statement in LaTeX math, without dollar signs",'
  - '  "lean": "the exact Lean 4 statement, starting with theorem main and ending before := (no proof)",'
  - '  "forbidden": ["the Mathlib names that ARE this theorem or prove it outright"],'
  - '  "history": "two to four sentences on where the problem comes from, only what you are sure of",'
  - '  "audience": "who the lesson is for: what the note says, else curious viewers with high-school math",'
  - '  "description": "the video''s YouTube description: what the viewer will see worked out and come away understanding, in two or three short paragraphs; plain and warm, no hype, no emoji, no links",'
  - '  "tags": ["eight to twelve search tags: the topic, the branch of math, the theorem''s names"]'
  - "}"
  - ""
  - >-
      The Lean statement must say exactly what the plain statement says - no stronger, no weaker -
      in Mathlib's standard definitions (Nat.Prime, Irrational, Finset.sum over Finset.range, and so
      on), as simply as the claim allows. Name it main. Use Unicode notation the way Mathlib does
      (ℕ, ℝ, ∑, √). If the note asks for something Lean cannot state well, state the nearest honest
      version and say so in "statement".
  - >-
      In "history", never invent a name, a date or a quotation: say less rather than guess.
  - ""
  - include: agents/episode.title
  - >-
      The title names what the viewer will wonder about - the question, the surprise - in plain
      words, never the theorem's textbook name alone, and never promises more than the lesson
      gives.
  - when: before
    say: "This note's other episodes went up as: {{before}}. Name this one differently."
