# A THUMBNAIL PAINTED FOR EACH EPISODE (the user, 2026-10-28: "an agentic workflow ... which would ask an
# agent to produce a compelling and relevant thumbnail. This flow might benefit from both the writer and
# the painter"). The YouTube card's Thumbnail, Painted, adds this step to the card that makes the episode
# (YouTubeThumbnail, an EpisodeStep): the writer reads the episode and writes what the painter paints, the
# painter paints it, and the code cuts it to YouTube's shape (1280x720).
#
# TRUE OF THE VIDEO: a thumbnail that promises what the video does not hold misleads the viewer who
# clicks it - and YouTube counts it as misleading - so the writer shows something the video holds.
#
# THE WORDS ON IT ARE THE WRITER'S CHOICE, few or none: a thumbnail is often seen no bigger than a stamp,
# and the title is printed under it already. The painter writes them exactly as given and nothing more:
# an image model left to itself letters in words of its own.
#
# THE EPISODE'S OWN PICTURES (a show's paintings, a letter's or a book's pictures), when it has any and the
# card's "Match the video's pictures" is ticked, are shown to the writer, who names the ones the painter is
# handed to paint after - and naming none, the code hands it a few spread through them. THE THUMBNAIL IS ONE
# MORE OF THEM (the user, 2026-10-30: "the thumbnails generated are just random weird pictures, completely
# different from the video"): the writer is told to design a picture of their world in their medium and
# colors, and the painter to paint as they are painted.
#
# NO SAMPLE BRIEF: a sample in a prompt comes back word for word, every run, so the format is placeholders
# only.
#
# ANOTHER IS ANOTHER (the user, 2026-10-30: "twice now, the thumbnail generated has essentially been exactly
# the same thing, right down to the exact same text"): sent the same prompt, the writer came back with the
# same design and the same four words. Every thumbnail painted is kept for the author to pick between, so
# the writer is shown the ones already kept and told to make one unlike them.
#
# The code gives: {{show}}, {{title}}, {{description}}, each maybe empty; {{words}}; {{pictures}} (how
# many pictures the writer is shown, 0 for none); {{earlier}}, the thumbnails already kept for the video,
# each its {{n}}, its {{brief}} and its {{lettering}} (maybe empty), none the first time. The painter's part: {{picture}}, {{words}} (maybe empty),
# {{refs}} (whether it is handed pictures to follow) and {{portrait}} (a portrait video's thumbnail).
system: >-
  You design the thumbnail a video goes up to YouTube with. Answer with the JSON asked for and nothing
  else.
prompt:
  - >-
      Design the thumbnail for one video: the picture a viewer sees before choosing to watch it, often
      no bigger than a stamp in a list on a phone.
  - ""
  - when: show
    say: "THE SHOW: {{show}}"
  - when: title
    say: "THIS VIDEO'S TITLE, printed under the thumbnail: {{title}}"
  - when: description
    say: "ITS DESCRIPTION: {{description}}"
  - ""
  - "WHAT THE VIDEO SAYS, as its voice reads it:"
  - ""
  - "{{words}}"
  - ""
  - when: pictures
    say: >-
      THE VIDEO'S OWN PICTURES are attached, numbered 1 to {{pictures}} in the order the video shows
      them. The thumbnail must look like one more of them, as if it came from the same video: the
      painter is handed the ones you name - naming none, a few of them - and paints in their look. So
      design a picture of their world, the same kind of picture in their medium, their style and their
      colors, and name the ones whose look comes closest to what you design.
  - >-
      Show one thing this video holds that would make a viewer want to see it: a moment, an object, a
      figure or a place from it. One clear subject, large in the frame, on a ground plain enough to read
      at a glance, with strong light and dark{{^pictures}} and colors that stand apart{{/pictures}}{{#pictures}},
      in the pictures' own colors{{/pictures}}. Nothing the video does not hold: no scene, promise or
      person that is not in it.
  - >-
      Words on it are your choice: none, or at most four that the title does not already say, large
      enough to read at the size of a stamp. No logo, no watermark, no border, and no channel's name
      unless the title says it.
  - >-
      Write for the painter everything it must paint: the subject, where it is, the light, the colors
      and how it is framed. The painter sees only what you write{{#pictures}} and the pictures you
      hand it{{/pictures}}.
  - ""
  - when: earlier
    say: >-
      THUMBNAILS ALREADY PAINTED FOR THIS VIDEO, as their briefs were written. The author keeps every one
      and has asked for another to choose from, so one like these is wasted: show another subject or
      moment of the video, framed another way, in other colors, and with other words or none - never the
      words of one of these.
  - each: earlier
    say: '{{n}}. {{brief}}{{#lettering}} Its words: "{{lettering}}".{{/lettering}}{{^lettering}} No words on it.{{/lettering}}'
  - when: earlier
    say: ""
  - "Answer with ONE JSON object and nothing else:"
  - ""
  - when: pictures
    say: '{"picture": "<what the painter paints>", "words": "<the words on it, or empty>", "after": [<the numbers of the pictures the painter is handed, or none>]}'
  - when: "!pictures"
    say: '{"picture": "<what the painter paints>", "words": "<the words on it, or empty>"}'
painter:
  - "Paint the thumbnail of a YouTube video."
  - ""
  - "{{picture}}"
  - ""
  - when: words
    say: >-
      THE WORDS ON IT, exactly these and no others: "{{words}}" - large, bold and clean, in a typeface
      that suits the picture, set where they cover nothing that matters.
  - when: "!words"
    say: "No text, letters or numbers anywhere in it."
  - when: refs
    say: >-
      The attached pictures are frames of the video itself. Paint the thumbnail as one more of them, so
      it looks as if it came from the same video: their medium and how they are painted or drawn, their
      colors, their light and their world - never another style. Never copy one whole.
  - >-
      FORMAT: {{#portrait}}PORTRAIT 9:16{{/portrait}}{{^portrait}}LANDSCAPE 16:9{{/portrait}}. It is
      cut to exactly that shape from whatever size is painted, so keep everything that matters away from
      the edges. No border, no frame, no watermark, no signature.
