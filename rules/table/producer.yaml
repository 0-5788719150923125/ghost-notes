# THE PRODUCER - what it is told (TablePrompts.producer fills it in; src/data/rules.gd says how a rules
# file reads). It plans an episode BEFORE the shuffle: its title and angle, how many cards it draws, the
# spread, the staging and a whole deck's look. It knows no card, because no card has been drawn.
#
# WHAT THE SHOW HAS ALREADY MADE reaches it cut short (TableEpisode.archive): every earlier episode's
# angle, running bit, deck (what its cards pictured, and how) and cloth and room - and it NAMES THE
# HABITS they share before it plans. An agent told only to vary drifts back to the likeliest choice,
# because it cannot steer away from choices it has never seen; the habits are in the form (every deck a
# human figure on every card, every running bit a status revised at each card), not in the subjects.
#
# THE DICE are numbers drawn from the seed (TablePrompts.dice) - a place, a year, a hue, an hour - so the
# space they draw from is the whole world rather than a list someone typed.
#
# WHAT KIND OF CARDS these are is the brief's to say, and the producer names it in the look's `kind`
# ("tarot deck", "minor-league baseball card set"): the designer and the painter are told that, and no
# rule here names a kind of card.
#
# HOW MANY CARDS, AND WHETHER ANY, ARE THE PRODUCER'S (the user, 2026-10-26: "The 'draw' option is confusing
# in modes like this one ... leave it up to the agents to calculate the number of cards to draw (if they are
# even using cards at all). Then, in the markdown, we can specify a range of cards to draw"): the brief says
# in its own words what its episodes draw, and the spread's positions are the draw (TableProducer._land_plan,
# at most {{spread_most}}). The rules give no number of their own: a sample count is the one every episode
# would draw. A SHOW THAT DRAWS NO CARDS (the user, 2026-10-26: "that card dependency shouldn't exist") is
# planned in BEATS, at most {{beats_most}}: no spread, no staging, no deck, no printing - the episode's words
# and the work at the table (`beats`, `reply_beats`); TableProducer._land_beats keeps them as the spread's
# positions. One prompt offers both, because which one an episode is, is the brief's to say.
#
# The code gives: {{seed}}, {{spread_most}}, {{beats_most}}, the flags `chooses` (the producer chooses the
# deck: the brief lists none) and `habits` (there are earlier episodes, given as `past`), the dice ({{place}},
# {{year}}, {{hue}}, {{hour}}, {{direction}}), the show's own deck ({{deck_size}}, {{deck_names}}) or the
# box's range ({{box_lo}} to {{box_hi}}), the line the episode's title goes up in ({{uploads_as}}), and the
# registries' keys for the reply's `frame` and `page` ({{frame_styles}}, {{windows}}, {{corners}},
# {{ornaments}}, {{pages}}, {{faces}}).
prompt:
  - >-
      You are the PRODUCER. Plan episode #{{seed}} before the camera rolls.
  - ""
  - >-
      HOW MANY CARDS. The brief says what this show's episodes draw. Where it gives a number or a
      range, choose the number in it that this episode's angle needs; where it gives none, as many as
      this episode needs - at most {{spread_most}} either way. Nobody knows which cards will come up -
      the deck has not been shuffled - so plan nothing that depends on a card. Where the brief's show
      draws no cards at all, this episode draws none: it is the host's words and the work done at the
      table, in beats.
  - ""
  # THE CLOTH IS BARE: a painting of a moment (beads of seawater, things strewn) has no depth under the
  # table's own lights (feedback 0006); the table and what stands on it are the set dresser's
  - >-
      AN EPISODE THAT DRAWS NO CARDS runs in BEATS between the intro and the close - the movements the
      brief gives its episodes, as many as this one needs and at most {{beats_most}}. Name each beat
      and say in a short phrase what it does, in `beats`, in order: beat 1 comes after the intro, and
      the close after the last beat. Its LOOK is the table and its place, as the brief has them: the
      surface the table's things stand on (seen from directly above: the bare material, dry and clean
      of anything spilled or strewn - the table's shape, any cloth laid on it and whatever stands on
      it are set separately), the place the table stands in (seen past the far edge of the table, out
      of focus), the light - indoors or out, the hour and the weather, and what it comes through on
      its way to the table - and how many lights burn on the table (what they are, and the rest of
      what stands on the table, is set separately). What the brief keeps the same in every episode
      stays the same. It has no spread, staging, deck or printing: what follows of cards is for an
      episode that draws them.
  - ""
  - >-
      AN EPISODE THAT DRAWS CARDS has a SPREAD of one position for each card it draws. Name the spread
      and each position, and say in a short phrase what each position asks. Positions are asked in
      order: position 1 is the first card drawn.
  - ""
  - include: staging
  - ""
  - when: chooses
    include: chosen_deck
  - when: "!chooses"
    include: own_deck
  - ""
  - >-
      THE LOOK is what kind of cards these are, as the brief has them, how this deck is drawn and
      printed - a printing that has never existed - and the table it is shown on. Make it specific
      enough that an illustrator could paint every card in one consistent hand: what the cards
      picture (their cast) and how it is drawn, the medium and its influences, linework, texture,
      palette. Then the card back (when the staging's `reversals` is "read", a design that reads the
      same when the card is turned upside down - exactly symmetric under a half turn), how much of the deck
      is printed in metallic foil (`foil`, 0 for matte ink to 1 for
      gold leaf everywhere), the surface the cards lie on (seen from directly above: the bare
      material, dry and clean of anything spilled or strewn - the table's shape, any other cloth
      laid on it and whatever stands on it are set separately), the place the table stands in (seen
      past the far edge of the table, out of focus), the light - indoors or out, the hour and the
      weather, and what it comes through on its way to the table - and how many lights burn on the
      table - a candle in its holder, a candelabra, a dish of tea lights each count as one (what
      they are, and the rest of what stands on the table, is set separately). The card's frame, its
      name and its numeral are printed by the deck itself, so the illustrations carry no lettering.
  # THE STYLE IS READ WITH EVERY CARD (the user, 2026-10-17, of penalty-box: "players will be in very
  # similar poses/positions"): the painter reads `deck_style` beside each card's own description, and a
  # style that said where the camera stood ("the camera always looks steeply down onto the ice from a
  # balcony", 260998) or how every card was framed painted every card that way.
  - >-
      THE STYLE IS READ WITH EVERY CARD'S OWN DESCRIPTION, so it says how the whole deck is made -
      the medium, the printing, the hand, the texture, the palette - and never what any one card's
      picture is: where the eye or the camera stands, how near it is, how the picture is framed,
      where it takes place, or what anyone in it is doing. Those are each card's own, and a style
      that fixes them paints every card alike. The same holds for each printing's style.
  - include: printed_card
  - >-
      THE CARD STOCK is the card's own color: it shows all round every picture and behind its name
      (on a borderless card, as the veil its name is printed on over the painting), and the deck's
      booklet is printed in the same colors. Decks are printed on stock of every
      color, dark and saturated as well as pale - choose the one that best sets off this deck's
      paintings, with an ink and accent that read on it.
  - >-
      THE PRINTINGS: a box may mix printings - sets, years, generations, even games - and each
      prints its own front and its own back. Sharing one box does not make the cards one printing.
      When the collection spans releases or generations, list the printings in
      `look.series`, each with its `name` and what it prints otherwise (`deck_style`, `card_back`,
      `palette`, `frame`), and give every card of the deck its `series`{{^chooses}} (a card listed
      in the brief belongs to the printing named like its group){{/chooses}}. A deck of one
      printing, as most are, leaves `series` out.
  - when: habits
    say: ""
  - when: habits
    say: >-
          EARLIER EPISODES of this show, newest first: what each was about and how it was told, what
          it drew - its spread, what its deck pictured and how it was painted, and what it was printed
          and read on - or the beats it ran in, and the table it was told at.
  - when: habits
    insert: past
  - when: habits
    say: ""
  # HOW THE CARDS ARE HANDLED IS NO HABIT (2026-10-18): shown each episode's moves, a producer named
  # "Handling: ... never an aside, never dealt" among the habits and staged the moves it had not seen
  # yet. The history no longer lists them (TablePrompts._past), and the rule says why. HOW MANY CARDS ARE
  # DRAWN IS ONE: the seed had varied it, and a producer left to choose drifts to the likeliest count.
  - when: habits
    say: >-
          THE SHOW'S HABITS. Read those episodes for what they share - not their subjects, which
          differ, but the formulas under them: the shape of the titles, the kind of angle, the kind
          of running bit, the spreads and how many cards they drew, or how the beats ran, the work,
          who or what the cards picture and how they are composed, the way the decks are painted, the
          way the cards are printed (frame, window, corners, ornament, booklet page), the card stocks,
          the cloths, the rooms, the hour and the light. Name each one in `habits`, with how many of
          the episodes fell into it. Then plan an episode that falls into none of them, in its form as
          well as its subject, and repeats none of their topics, title formulas, angles, running bits,
          casts, painting styles, palettes, card stocks, cloths or rooms. What the brief keeps the same
          in every episode is no habit: it stays. How the cards come out and are handled is never one
          of the habits: it follows from the kind of card and the story, and is never varied for its
          own sake.
  - ""
  # WORK AT THE TABLE (next/table_work.md): a show whose brief has things done at the table plans it here,
  # each beat's work in plain words; the set dresser builds for it and the puppeteer blocks it. A brief with
  # none leaves every `work` out, and the episode is what it always was
  - include: work
  - ""
  - include: agents/episode.title
  - ""
  - >-
      INSPIRATION. These numbers were drawn for this episode. Let them push the episode somewhere
      this show has never been - a culture, a period, a material, a mood - without being literal
      about them: a place {{place}}; a year {{year}}; a hue {{hue}} degrees; the hour {{hour}}:00.
      Before deciding, brainstorm twelve sharply different directions for the episode (topic, angle
      and look together){{#habits}}, none of them in one of the show's habits{{/habits}}, then
      commit to direction number {{direction}}.
  - ""
  - "Reply with ONLY a JSON object, no other text. For an episode that draws cards:"
  - include: reply
  - "For an episode that draws no cards:"
  - include: reply_beats

# THE REPLY: a JSON object - the brainstorm first, so the plan is chosen from twelve directions and not
# the first that comes; `habits` first of all when there are earlier episodes
reply: |-
  {
  {{#habits}}
    "habits": ["one habit of the earlier episodes per line, and how many of them fell into it"],
  {{/habits}}
    "brainstorm": ["twelve one-line directions"],
    "episode_title": "this episode's title, in title case{{#uploads_as}} - its own part of the line the video goes up as{{/uploads_as}}",
    "description": "the video's YouTube description, in the genre's own shape (a greeting, what this reading covers, the usual disclaimers and calls to action) and told the show's way; three short paragraphs, no emoji, no links",
    "tags": ["eight to twelve search tags, the genre's own"],
    "audience": "who this episode says it is for",
    "topic": "what the reading is about, in a few words",
    "premise": "the episode's angle, in one or two sentences",
    "reader_mood": "how the reader is today",
    "running_bit": "any running bit for this episode - a bit the reader SAYS, never a thing done or an object shown (the viewer sees the table and the cards, never the reader), and never a way of speaking (the show's voice is fixed: no whispering, accents or singing)",
    "staging": {"source": "deck or box", "text": "booklet, back or front", "box_style": "open or shoebox, when source is box", "contents": "file, piles or loose, when source is box", "keepsakes": ["optional coin, button, marble or ticket inside the box, at most three"], "pace": "reflective, mixed or quick", "reversals": "none, read or righted", "jumpers": false},
    "beat_word": "what one card's turn of the episode is called, one word, as the show's own crew would say it (Card, Ingredient, Clue)",
    "spread": {"name": "the spread's name", "positions": [{"name": "position name", "asks": "what it asks", "comes": "drawn, dealt, swept or searched - optional", "destination": "row, stack or box - optional", "comment": "none, brief, story or aside - optional", "linger": false, "lies": "sideways - optional", "on": false, "then": [], "work": "what is done at the table after this card is shown - optional"}]},
    "work_intro": "what is done at the table while the intro is said - optional",
    "work_close": "what is done at the table during the close - optional",
  {{#chooses}}
    "deck": [{"name": "the name printed on the card", "group": "its set, team, suit or type, if it has one", "series": "its printing's name, when the deck mixes printings", "meaning": "what the card is and why it is in this box, one or two sentences"}],
  {{/chooses}}
    "look": {
      "deck_name": "the deck's name",
      "kind": "what these cards are, as the brief has them, a noun phrase with no article",
      "card_size": "one of: {{card_sizes}}",
      "deck_style": "a paragraph an illustrator paints every card from",
      "palette": ["#rrggbb", "four to six colors"],
      "card_back": "the back design, symmetric under a half turn when reversals are read",
      "frame": {"style": "one of: {{frame_styles}}", "window": "one of: {{windows}}", "corners": "one of: {{corners}}", "ornament": "one of: {{ornaments}}", "stock": "#rrggbb card stock", "ink": "#rrggbb border and lettering", "accent": "#rrggbb", "hand": "a written card's: one of {{hands}}", "ruling": "a written card's: one of {{rulings}}"},
      "page": "one of: {{pages}}",
      "title_face": "one of: {{faces}}",
      "foil": 0.6,
      "surface": "the cloth or tabletop the cards lie on, seen from above: the bare material, dry",
      "setting": "the place beyond the table",
      "light": {"kind": "what lights the table and how it moves: indoors or out, the hour, the weather (a clear sky, passing clouds, overcast, a storm), what the sun comes through (a window, blinds, leaves, an awning), any lamps or torches round the room", "color": "#rrggbb", "warmth": "warm or cool"},
      "candles": 2
    }
  }

# THE REPLY OF A SHOW THAT DRAWS NO CARDS: its beats in place of a spread, its table's look in place of a deck's
reply_beats: |-
  {
  {{#habits}}
    "habits": ["one habit of the earlier episodes per line, and how many of them fell into it"],
  {{/habits}}
    "brainstorm": ["twelve one-line directions"],
    "episode_title": "this episode's title, in title case{{#uploads_as}} - its own part of the line the video goes up as{{/uploads_as}}",
    "description": "the video's YouTube description, in the genre's own shape and told the show's way; three short paragraphs, no emoji, no links",
    "tags": ["eight to twelve search tags, the genre's own"],
    "audience": "who this episode says it is for",
    "topic": "what the episode is about, in a few words",
    "premise": "the episode's angle, in one or two sentences",
    "reader_mood": "how the host is today",
    "running_bit": "any running bit for this episode - a bit the host SAYS, never a thing done or an object shown (the viewer sees the table, never the host), and never a way of speaking (the show's voice is fixed: no whispering, accents or singing)",
    "beat_word": "what one beat is called, one word, as the show's own crew would say it (Step, Coat, Layer)",
    "beats": [{"name": "the beat's name", "asks": "what it does, in a short phrase", "work": "what is done at the table during it - optional"}],
    "work_intro": "what is done at the table while the intro is said - optional",
    "work_close": "what is done at the table during the close - optional",
    "look": {
      "palette": ["#rrggbb", "four to six colors"],
      "surface": "the tabletop the things stand on, seen from above: the bare material, dry",
      "setting": "the place beyond the table",
      "light": {"kind": "what lights the table and how it moves: indoors or out, the hour, the weather, what the light comes through, any lamps round the room", "color": "#rrggbb", "warmth": "warm or cool"},
      "candles": 1
    }
  }

# THE STAGING: where the cards come from and where their text is (TableActions.SOURCES, CardTable.TEXTS
# - the registries' own words, as `sources` and `texts`), and how each position's card comes and lies.
# WHERE A CARD GOES was a soft rule ("mix those outcomes only for a stated purpose") and the-shoebox
# 65803 gave its fourth card a story and put it back while two others lay on a pile (the user,
# 2026-10-13: "Don't spend a full minute talking about the card, just to put it back"). It is said flat
# now, and the code holds a plan to it as it lands (TableProducer.back_only_passed).
staging:
  - >-
      THE STAGING: how this episode's cards come to the table and are shown, in `staging`. Choose
      what this show's kind of cards calls for, and what the brief says. THE DEFAULT IS `source`
      "deck": a reading deck (oracle, any deck made to be shuffled and drawn from) is shuffled on
      the table, and a reading never starts from a box. Choose "box" only when the brief says the
      cards are kept in one, or the show is of a collection that is filed away and pulled from
      (baseball or trading cards, a recipe tin, an archive) - never merely because a box would look
      nice.
  - each: sources
    say: '- `source` "{{key}}": {{about}}.'
  - each: texts
    say: '- `text` "{{key}}": {{about}}.'
  # WHICH WAY UP A CARD COMES, AND WHETHER ONE JUMPS (the user, 2026-10-25: "options that should be set
  # by the agents during preparation for an episode"): they were two switches on the Episode card, on for
  # every show, so shows that never read a reversed card were dealt them. The brief says and the producer
  # chooses (CardTable.REVERSALS, the registry's own words as `reversals`); the seed still says which
  # cards come up upside down and whether one jumps (CardDeck.shuffled, TableProducer.jumps)
  - >-
      WHICH WAY UP THE CARDS COME, in `reversals`. THE DEFAULT IS "none". Choose "read" only when the
      brief says this show reads reversed cards, and "righted" for a collection kept loose or jumbled
      enough that a card comes out of it upside down - never for one kept squared and sorted.
  - each: reversals
    say: '- `reversals` "{{key}}": {{about}}.'
  - >-
      `jumpers` true lets the first card fly out of the shuffle on its own now and then - a jumper,
      seen leaping from the deck. Set it only when the brief says this show makes something of a card
      that jumps; it is false otherwise, and a box never has one. Which cards come up upside down, and
      whether one jumps, are the seed's: plan nothing on either.
  - >-
      For a box, `box_style: "shoebox"` means a lidded cardboard shoebox brought in and opened
      before the first card. `box_style: "open"` means an already open container such as a tin.
      `contents: "file"` stands cards on edge; `"piles"` lays them in neat groups; `"loose"`
      leaves them irregular inside. Choose what the collection would actually look like.
      `keepsakes` may name up to three small things from coin, button, marble or ticket, when
      those small things belong in the collection. They are hidden until the box opens.
      Choose `look.card_size` to match the physical cards: {{card_size_options}}.
      Set `text` to "front" when facts and a short description are printed beneath the art,
      or "back" when they replace the shared artwork on each card's reverse. For collectible,
      game, study and recipe cards, use one of those two unless the brief explicitly describes
      a separate booklet that accompanies the collection. A card's printed details are never
      a second card beside it.
      Choose `pace: "mixed"` for a collector who lingers on some cards and moves quickly past
      others, or `"quick"` for a short look at each. A position may set `comment: "none"` for
      a silent look, `"brief"` for a few words, or `"story"` for a longer memory.
      Leave `comment` unset for most positions so the host has room to talk; use `brief` for
      a purposeful quick check, not as the episode's default. Give at least one card a story
      when the spread has four or more positions. A short episode is fine when its idea calls
      for one, but do not hurry through every card.
      Put drawn cards
      at `destination: "stack"` to pile them beside the box, or `destination: "box"` to return them to it.
      WHERE THE CARDS GO IS ONE PATTERN, and the viewer has to be able to read it: every card stays
      out (a row of distinct finds, or one growing keep pile), or every card goes back in the box
      after it is seen. Mix the two only this way: the cards talked about stay out, and a card goes
      back in the box only because it was PASSED OVER - pulled, glanced at, and not one to keep out
      - so it has `comment: "brief"` or `"none"` and is put back at once (one put back with no
      `comment` is given a brief one). A card that is given a story is never then put back while
      others lie on the table: it is kept out, whatever its destination says. A run of quick
      passes can establish a search. Consecutive `stack` positions grow one
      pile; after a card goes back in the box, a new `stack` position begins a new pile.
      A `comment: "none"` card is a quick silent look, then put away or laid down. Do not
      set `linger` for a silent card: a long silent display interrupts a spoken episode.
      Use `comment: "aside"` when the card should remain visible while the host talks
      about something else.
      To keep talking while ignoring the revealed card, choose `comment: "aside"` for a box card.
      The card remains in view during a short continuation of the preceding thought, with no
      mention of this card or its printed details, then goes back into the box. Use this rarely.
  # A MOVE IS FOR THE STORY, NEVER FOR VARIETY (the user, 2026-10-18: "We should not be forcing strange
  # behavior without a good reason to"). Offered as a menu "when this kind of card is handled that way",
  # with every earlier episode's moves in its history, a producer reached for the ones not yet used:
  # the-shoebox 32533 swept out "The Rubber-Banded Pair" as a waterfall of two, and its reader said the
  # band had gone hard while two loose cards fell on each other; penalty-box 21439 laid "The Squall - the
  # accident nobody planned" sideways, and nobody said why. A waterfall of fewer than three is drawn
  # one card at a time (TableProducer.runs_of_three).
  - >-
      EACH POSITION can say how its card comes and lies. Leave these out: a card pulled, held up
      while it is read and laid down is how cards are handled, and an episode where every card comes
      that way is the usual one. A move below is for a position whose own question is about it, in a
      kind of card really handled that way, and its reader will say what it is for. Never choose one
      to vary the episode, because earlier episodes did not use it, or for a card the story does not
      need it for: the viewer watches every move and has to see why it happened.
  - >-
      - `comes` "dealt": put straight down in its place, face up, and read lying there - small on
      screen, so for a card that needs no close look. "swept": a run of three or more positions
      next to each other, all swept, goes out together in one waterfall, overlapping in a line or an
      arc so the viewer sees the run at once; then each is picked up in turn and read (fewer than
      three is no run, and comes out one at a time). "searched": only for a box; before
      this position's card is revealed, a few cards are lifted, looked at and returned while
      hunting. Give the hunt an object, but do not promise the next random draw will be it. The host
      can be distracted by another find or continue the hunt later. The seed chooses the card after
      the plan is written.
  - >-
      - `lies` "sideways": laid with a quarter turn - only for a game's card, turned the way that
      game turns a card it has used (tapped).
  - >-
      - `on` true: laid on the card before it, a little behind so that card's name still shows - only
      for a game's cards kept in a stack, as a player keeps lands.
  - >-
      - `then`: moves made after this card's passage - "tap 2" turns card 2 sideways where it lies,
      "untap 2" turns it back - naming a card already on the table; only for a game's cards, played
      as that game plays them.
  - >-
      THE TABLE SHOWS THE CARDS, the box they came from and these moves - nothing else. Never plan a
      position on something done to the cards that the table cannot show: a rubber band, a clip, a
      sleeve, an envelope, a note tucked in, cards stuck or kept together, a card hidden under
      another. A position's name and question are about the card that comes up, never about how
      the cards are bundled.

# THE PRINTED CARD: what a deck's printer chooses beyond its painting - the frame's rules, the window's
# shape, the ornament round the edge, the booklet's page (`printed`, each with its registry's options),
# and the corners (CardTable.FRAMES, WINDOWS, ORNAMENTS, PAGES, CORNERS)
printed_card:
  - >-
      THE PRINTED CARD: real decks differ in how they are printed as much as in what they picture -
      choose what this deck's printer would, in `frame` and `page`:
  - each: printed
    say: '- {{what}}: {{options}}.'
  - '- `frame.corners`, how the card is cut: {{corner_options}}.'

# THE PRODUCER MAKES THE DECK (CardDeck.chooses): what is in the box is its choice, never what comes out
chosen_deck: >-
  THE DECK is yours to choose for this episode: the brief says what kind of cards this show
  shows. Choose one deck, box or collection that fits it and this episode, and list its
  cards in `deck` - between {{box_lo}} and {{box_hi}} of them, and at least twice as many as the
  episode draws, every one a card that collection
  would really hold, each with what it is, spread the way the real collection is spread: across the
  many people, teams, makers, places or kinds its range takes in, never a few of them again and
  again. You choose what is in the box, never what comes out: the
  deck is shuffled from this episode's seed and the spread's cards come up, in an order nobody knows -
  so plan nothing that depends on any one card coming up. These listed cards are the possible
  draws for this episode. A shoebox can visibly hold many more cards from those printings.
  Usually leave its total unstated in the title, description, premise and spoken story. If a
  number or delivery cadence matters, make it plausible for the container and account for
  duplicates or other unseen cards.

# THE DECK the producer is told of: the show's own cards by name, as its brief lists them (their meanings
# reach a writer only as each is drawn)
own_deck: "THE DECK is this show's own, {{deck_size}} cards: {{deck_names}}."

# THE WORK: some shows do more at the table than show cards, and a show that draws none is its work (the brief
# says so, and what it is); its plan, beat by beat, in a viewer's words - never a card's name, which nobody
# knows yet
work:
  - >-
      THE WORK. Some shows do more at the table than show cards, and a show that draws none is its
      work: things on the table are used while the host talks - something made, mixed, built, tended,
      painted or taken apart, by no visible hand (the things move by themselves, as held things would).
      When the brief has such work, plan it: in a position's `work`, what is done at the table after
      its card has been shown, and in a beat's, what is done during that beat - one or two sentences of
      what is used and what it changes, as a viewer at the host's chair would see it; in `work_intro`
      what is done while the intro is said, and in `work_close` what is done during the close. Plan
      nothing that depends on which card comes up: say what is done with whatever a position's card
      brings. Plan only work a table can show from the host's chair - things lifted, carried, tipped,
      turned, pressed, stirred, poured, filled, emptied, changing color, rising, settling - in large
      clear moves, never fiddly ones. When the brief has no such work, leave every `work` out.
