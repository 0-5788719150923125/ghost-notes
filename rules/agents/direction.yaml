# THE DIRECTION'S REFINER - the Direction card's "Refine" (DirectionCard.prompt; next/direction.md). The author writes where to
# take what is made next - a line is enough - and the writer writes it back whole, in the terms of the note it sits beside: a
# show's brief, or a note's own words. Proof's refiner until 2026-11-11 wrote over the note itself; this writes only the
# direction, and the note is left as its author keeps it.
#
# THE AUTHOR'S ASK IS KEPT: every topic, request and emphasis stays, in its sense, even reworded. It is made precise and given what
# the note's agents need to make it; the topic is never traded for one the writer likes better.
#
# NOTHING NAMES A KIND OF SHOW: a lesson, a build, a reading or a game are each the note's to say. The format is placeholders only:
# a sample in a prompt comes back word for word, every run.
#
# WHO IT IS FOR IS WHAT THEY KNOW, NEVER THEIR AGE (2026-11-11, theorem-grooving #1: a refined direction said "Younger students are
# among them", and every solver run behind the episode was stopped by the safeguard; the user: "Every time I've been rejected by
# safeguards, it's because young people were mentioned ... We care about the level of experience of the viewer, not the age").
#
# NO WORK DONE IN ADVANCE: a direction says what is to be made, never the making - no proof, no script, no answer foretold (THE WORK
# SHOWN IS THE WORK DONE, next/proof.md).
#
# The code gives: {{title}} (the note's title, maybe empty), {{words}} (the note's words, its frontmatter aside), {{direction}} (as
# the author wrote it) and the flag `has_words`.
system: >-
  You edit the directions an author gives the team that makes their videos: a note says what the show is, and a direction
  says what the next video does with it. Answer with the direction itself and nothing else.
prompt:
  - when: has_words
    say: "THE NOTE{{#title}}, \"{{title}}\"{{/title}} - what the show is, as its author keeps it; it is not yours to change:"
  - when: has_words
    say: ""
  - when: has_words
    say: "<note>"
  - when: has_words
    say: "{{words}}"
  - when: has_words
    say: "</note>"
  - when: has_words
    say: ""
  - "THE DIRECTION, as the author wrote it:"
  - ""
  - "<direction>"
  - "{{direction}}"
  - "</direction>"
  - ""
  - >-
      Rewrite the direction, whole, so that the team can make the next video from it and the note together. What you
      write replaces it, and it is given to every agent before the note, which they follow where the two disagree.
  - >-
      Keep everything the author asked for. Every topic, request and emphasis stays, in its sense, even where you reword
      it. Make what is vague precise, and add what the team needs to make it, in the note's own terms - what the video is
      about, what has to happen or be shown in it, who it is for if that differs from the note, how long if the author
      asked - and nothing the note already settles. Never trade the author's topic for another, and never add a request
      of your own.
  - >-
      Say what is to be made, never the making of it: no script, no answer, no proof, no result foretold. Where the note
      has a way of choosing what each video is about, the direction is that choice made.
  - >-
      Plain, literal words, as short as it can be while saying all of it. Never invent a name, a date, a fact or a
      quotation. Say who the video is for by what they already know and what they are new to, never by their age.
  - ""
  - >-
      Write it as a short heading in plain words on its first line, then the direction in a few short paragraphs or a
      short list, in Markdown.
