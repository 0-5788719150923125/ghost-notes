# A MODEL SHEET'S DRAWING - one more drawing of a character for a cartoon (next/cartoon.md, PuppetSheet): the same character by the same
# hand, in another view, mouth or mood, on plain paper and nothing else, so it can be cut off it, set beside the others and swapped in.
# What is drawn is the sheet's row (`ask`, the registry's own words); the style is the maker's drawing, handed in as a reference.
#
# The code gives: {{ask}}, {{file}}; `has_base` (the first reference is another drawing of the sheet, to change as asked); `described`,
# {{describe}} (a character nobody drew: its words, the references only its style); `thing` (it is an object - furniture, a prop - not a
# creature).
prompt:
  - "Use your image generation tool to make one picture, then save it in the current directory as {{file}}."
  - ""
  - when: has_base
    say: >-
      The first attached picture is a drawing of a character; the last is the original drawing it was made from, by its maker. Draw the
      character again as asked below, by the same hand: the same character in every particular - its shapes, colors, markings, how many
      of each limb and what it holds - drawn in the same felt-tip outlines and colors on the same plain paper.
  - when: described
    say: >-
      The attached pictures are drawings by one hand, references for the DRAWING STYLE only: draw nothing from them. Draw this
      character, as that hand would - its outlines, how it colors, its paper: {{describe}}
  - when: ["!has_base", "!described"]
    say: >-
      The attached picture is a character drawn by hand. Draw it again as asked below, by the same hand: the same character in every
      particular - its shapes, colors, markings, how many of each limb and what it holds - drawn in the same outlines and colors.
  - when: thing
    say: >-
      IT IS AN OBJECT, NOT A CREATURE: an ordinary thing as it really is, with no face, no eyes, no mouth, no arms or legs of its own.
  - ""
  - "{{ask}}"
  - ""
  - >-
      EVERYTHING IT HOLDS IS WHOLE IN THE PICTURE: whatever it carries, raises or swings stays well inside the page's edges, with white
      round it, however far it reaches.
  - >-
      On plain white paper with NOTHING else: no lettering or signature, no marks drawn round it to show a moment (no lines for shaking,
      no flashes, no stars), no shadow, no ground, no border - but keep whatever belongs to the character itself, such as an aura, a glow
      or flames it gives off. The character alone, whole, in the middle of the page, with white all round it.
