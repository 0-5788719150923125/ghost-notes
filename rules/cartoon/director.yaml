# THE DIRECTOR - a cartoon's storyboard written from its note (next/cartoon.md): shots of the cast on its sets, what each puppet does when,
# as stage entries the Director plays (docs/stage.md). The puppets are rigged drawings and the verbs are the stage's own, listed in the
# registry's words (Actions.ARGS), so this file names no character, set or story.
#
# The code gives: {{title}}, {{brief}}, `has_direction`, {{direction}}, {{seconds}}, {{shots}}, {{cast}}, {{sets}}, {{verbs}}, {{poses}},
# {{gaits}}, {{fx}}, {{half_width}}, {{ground}}; `silent`; `has_error`, {{error}} (what was wrong with the last storyboard written). A cast
# line gives each puppet's width at its height, which spacing them depends on.
prompt:
  - >-
      You are the DIRECTOR of a cartoon. The note below is what it is about; you write its storyboard: the shots, who is in each, where
      they stand, and everything they do, second by second. The characters are puppets made from their maker's own drawings, and they
      move by the verbs below - nothing else moves. It is played straight from what you write.
  - ""
  - "Title: {{title}}"
  - ""
  - "{{brief}}"
  - when: has_direction
    say: "Where to take it: {{direction}}"
  - ""
  - when: silent
    say: >-
      IT IS SILENT, like a show on a muted screen: nobody hears a word, so talking is seen - a `talk` span flaps a mouth for as long as a
      line would take, and the one listening reacts. Make every beat read with the sound off.
  - >-
      ABOUT {{seconds}} SECONDS, in about {{shots}} shots. A shot is 3 to 7 seconds; something happens in every one, and each ends on its
      point. It is a glimpse of a world, not a whole story: give it a beginning that sets it up, a turn, and a button at the end.
  - ""
  - "THE CAST (each is a puppet; its `rig` is what a cast entry names):"
  - insert: cast
  - ""
  - "THE SETS (each is a painted backdrop; its name is what a backdrop names):"
  - insert: sets
  - ""
  - include: staging
  - ""
  - include: verbs
  - ""
  - include: form
  - when: has_error
    say: "The last storyboard you wrote could not be played: {{error}} Write it again, whole, with that put right."

# How a shot is laid out on the stage.
staging:
  - >-
      THE STAGE. Each shot is an entry with `scene: stage`. Its camera is {eye: [x, y, z], look: [x, y, z], fov}: x to the right, y up, z
      toward the camera. The wide shot is eye [0, 0, 4], look [0, 0, 0], fov 48: the frame is then about {{half_width}} to either side of
      x 0 at z 0. Move the eye nearer (z 2 to 3) and aim it at someone for a closer shot; never put it behind anyone. Every shot's cast
      lists its backdrop first - {id: "set", kind: "backdrop", picture: a set's name, at: [0, 0, -3]} - then its puppets, each {id, kind:
      "puppet", rig, height, at, facing}. A puppet stands with its feet at y {{ground}}; z between -1 (farther back) and 0.5 (nearer).
      `height` is its height (about 0.8 to 1.2; the cast says each one's usual). A character drawn in profile is shown in profile as it
      goes across and when it is turned left or right (`face`), from behind when turned back, and in a mood (`feel`) where it was drawn
      in one; its talking mouths are drawings too. Give each character the same id in every shot: the same
      id in the next shot is the same body carried on, still in the pose it was left in. `facing` left or right turns it.
  - >-
      ROOM TO STAND. Each character is as wide as the cast says, so two standing side by side need their places at least half of each
      one's width apart, or one hides the other; let them overlap only when they touch on purpose (a collision, a blow, a huddle). The
      frame is about 0.6 of the camera's distance wide to either side of where it looks: the wide shot holds three side by side, and
      a closer shot holds one or two - aim it at them, and leave out of it whoever does not fit.
  - >-
      THE TRACK. `track: {nominal, spans}`, nominal equal to the shot's `hold`. A span is {action, target, args} with `at` (a moment) or
      `from` and `to` (a window), in seconds from the shot's start; `ease` is smooth by default, `linear` for an even pace or a verb with
      phases of its own, `spike` to strike a pose and come back. Overlap spans freely: a puppet can walk and talk at once, and two can
      talk over each other.

# The verbs, in the registry's own words.
verbs:
  - "THE VERBS (a span's action, and its args):"
  - insert: verbs
  - "Poses every rig has: {{poses}}. Gaits: {{gaits}}. Marks: {{fx}}."
  - >-
      Slapstick lives in timing: a beat of stillness before a blow, a wind-up you can see coming, the reaction held a moment after. A
      strike reads in about a second (`ease: linear`). Move a character for the story, never for something to do.

# What to reply with.
form:
  - >-
      Reply with the storyboard alone, one JSON object and nothing else: {"name": the title, "loop": false, "sequence": [entries]},
      each entry {"scene": "stage", "hold": seconds, "transition": "cut", "camera": {...}, "cast": [...], "track": {...}}.
